# netbird-gl - included into the GL admin panel server block (gl-conf.d).
# "^~" stops nginx from evaluating GL's regex location for *.html, which
# would add "X-Frame-Options: DENY" and break the page inside the panel.
location = /netbird-gl { return 302 /netbird-gl/; }
location ^~ /netbird-gl/ {
    root /www;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
}
# API: CGI executed by GL's own fcgiwrap (passes all request headers)
location = /netbird-gl/api {
    client_max_body_size 8k;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /usr/lib/netbird-gl/api.cgi;
    fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    fastcgi_read_timeout 120s;
    fastcgi_pass unix:/var/run/fcgiwrap.socket;
}
